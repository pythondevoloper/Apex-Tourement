# Bepul FCM push serveri (Cloud Functions / Blaze o'rniga).
# Har ~5 daqiqada ishga tushib, bazadagi yangi xabarnomalarni topiclarga push qiladi.
# Public repo uchun GitHub Actions bepul. Secret: FIREBASE_SERVICE_ACCOUNT.
name: FCM Push (cron)

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Bog'liqliklar
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Yangi xabarlarni push qilish
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_DB_URL: https://apex-league-2e8fc-default-rtdb.europe-west1.firebasedatabase.app
          FIREBASE_PROJECT_ID: apex-league-2e8fc
        run: python scripts/fcm_push.py

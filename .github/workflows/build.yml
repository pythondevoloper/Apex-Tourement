# Joylashuvi: .github/workflows/build.yml
name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Tizim paketlari
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf automake libtool \
            pkg-config zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev \
            build-essential ccache

      - name: Buildozer o'rnatish
        run: |
          python -m pip install --upgrade pip
          pip install buildozer "cython==0.29.37" setuptools virtualenv

      - name: SDK/NDK keshi
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ hashFiles('buildozer.spec') }}

      - name: APK qurish
        run: buildozer -v android debug

      - name: APK ni saqlash
        uses: actions/upload-artifact@v4
        with:
          name: apex-tournament-apk
          path: bin/*.apk

# Joylashuvi: .github/workflows/build.yml
# Uchta APK quradi: o'yinchi (player), admin (admin) va hakam (referee).
# v* tegi bosilganda APK lar GitHub Release ga yuklanadi (ilova yangilanish xabari shu yerdan).
name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        app: [player, admin, referee]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Tizim paketlari
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf automake libtool \
            pkg-config zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev \
            build-essential ccache libltdl-dev libtool-bin gettext

      - name: Buildozer o'rnatish
        run: |
          python -m pip install --upgrade pip
          pip install buildozer "cython==0.29.37" setuptools virtualenv

      - name: Ilova papkasini tayyorlash
        shell: bash
        run: |
          D=build_${{ matrix.app }}
          mkdir -p "$D"
          cp common.py cloud.py config.py trophy.png presplash.png logo_*.png "$D"/
          cp ${{ matrix.app }}.py "$D"/main.py
          cp buildozer_${{ matrix.app }}.spec "$D"/buildozer.spec
          if [ "${{ matrix.app }}" = "admin" ]; then
            cp icon_admin.png "$D"/icon.png
          else
            cp icon.png "$D"/icon.png
          fi

      - name: SDK/NDK keshi
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            build_${{ matrix.app }}/.buildozer
          key: buildozer-${{ matrix.app }}-${{ hashFiles('buildozer_*.spec') }}

      - name: APK qurish
        working-directory: build_${{ matrix.app }}
        shell: bash
        run: buildozer -v android debug 2>&1 | tee build.log

      - name: Xato sababi (faqat xato bo'lsa)
        if: failure()
        working-directory: build_${{ matrix.app }}
        shell: bash
        run: |
          N=$(grep -n "Command failed" build.log | head -1 | cut -d: -f1)
          echo "=== 'Command failed' qatori: $N ==="
          sed -n "$((N-80)),$((N-1))p" build.log
          echo "=== 'rror' so'zi bor qatorlar (oxirgi 25 ta) ==="
          grep -n -i "error\|exception\|not found" build.log | tail -25

      - name: APK ni saqlash
        uses: actions/upload-artifact@v4
        with:
          name: apex-${{ matrix.app }}-apk
          path: build_${{ matrix.app }}/bin/*.apk

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: apex-*-apk
          merge-multiple: true
          path: apks

      - name: Release ga yuklash
        uses: softprops/action-gh-release@v2
        with:
          files: apks/*.apk
          generate_release_notes: true
